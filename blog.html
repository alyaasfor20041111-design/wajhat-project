                <nav class="hidden md:flex items-center gap-8 font-sans">
                    <a href="#" class="text-text font-medium hover:text-primary transition-colors">الرئيسية</a>

                    <button type="button"
                        class="md:hidden p-2 rounded-lg text-heading hover:bg-card-tint focus:outline-none">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16"></path>
