<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | تأجير السيارات</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Almarai:wght@300;400;700;800&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../../dist/assets/css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>


<body class="min-h-screen bg-[#FAFAFA] flex items-center justify-center p-3 sm:p-5 font-sans">


    <div dir="ltr"
        class="relative w-full md:w-[90%] h-[980px] md:h-[680px] bg-white rounded-[30px] gap-7 overflow-hidden shadow-2xl flex flex-col lg:flex-row">


        <!-- Info Login -->


        <div dir="rtl"
            class="relative w-full lg:w-[42%] bg-[#fffdfc] p-6 sm:p-8 md:p-10 lg:p-12 flex flex-col justify-center order-1 lg:order-2">


            <!--Overlay image  -->
            <div class="absolute -bottom-20 -left-20 w-56 h-56 rounded-full border-[25px] border-[#800020]/10">
            </div>


            <div class="relative z-10 ">

                <div class="mb-7 mt-6">

                    <h1 class="text-3xl sm:text-4xl text-center font-extrabold text-[#480707] mb-3">
                        تسجيل الدخول
                    </h1>

                    <p class="text-gray-500 text-sm leading-6 text-center">
                        سجّل الدخول إلى حسابك لمتابعة رحلتك معنا.
                    </p>

                </div>


                <form id="loginForm" class="space-y-5">


                    <!-- Email -->

                    <div>

                        <label class="block text-sm font-bold text-text mb-2">
                            البريد الإلكتروني
                            <span class="text-red-600">*</span>
                        </label>

                        <div class="relative">

                            <i class="fa-solid fa-envelope absolute right-4 top-1/2 -translate-y-1/2 text-[#F93A3A]">
                            </i>

                            <input type="email" id="email" placeholder="أدخل البريد الإلكتروني" class="w-full h-12 pr-11 pl-4 border placeholder-gray-400 border-text/25 shadow shadow-inner shadow-gray-200 rounded-xl bg-white outline-none transition
                                focus:border-text/40
                                focus:ring-2 focus:ring-[#800020]/10
                                text-sm">

                        </div>

                    </div>


                    <!-- Password -->

                    <div>

                        <label class="block text-sm font-bold text-text mb-2">
                            كلمة المرور
                            <span class="text-red-600">
                                *
                            </span>
                        </label>

                        <div class="relative">

                            <i class="fa-solid fa-lock absolute right-4 top-1/2 -translate-y-1/2 text-[#F93A3A]">
                            </i>

                            <input type="password" id="password" placeholder="أدخل كلمة المرور" class="w-full h-12 pr-11 pl-11 border placeholder-gray-400 border-text/25 shadow shadow-inner shadow-gray-200 rounded-xl bg-white outline-none transition
                                focus:border-text/40
                                focus:ring-2 focus:ring-[#800020]/10
                                text-sm">


                            <button type="button" onclick="togglePassword()"
                                class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#800020]">

                                <i id="eyeIcon" class="fa-solid fa-eye-slash">
                                </i>

                            </button>

                        </div>

                    </div>


                    <!-- Remember me -->

                    <div class="flex items-center justify-between text-sm">

                        <label class="flex items-center gap-2 cursor-pointer text-gray-600">

                            <input type="checkbox" class="appearance-none w-5 h-5 rounded-md border-2 border-[#800020]
                                checked:bg-[#740f28] checked:border-[#800020]relative cursor-pointer
                                after:content-['✓']
                                after:absolute after:text-white after:text-xs after:font-bold
                                after:left-1/2 after:top-1/2
                                after:-translate-x-1/2
                                after:-translate-y-1/2
                                after:opacity-0
                                checked:after:opacity-100">

                            <span>
                                تذكرني
                            </span>

                        </label>


                        <a href="Forget-Password.html" class="text-primary font-bold hover:underline">
                            نسيت كلمة المرور؟
                        </a>

                    </div>


                    <!-- رسالة الخطأ -->

                    <p id="errorMsg" class="hidden text-red-600 text-sm bg-red-50 rounded-lg p-3">
                    </p>


                    <!-- button login -->

                    <button type="submit" id="err" class="w-full h-12 rounded-xl text-white font-bold
                        bg-[#F93A3A]
                        hover:bg-[#E61C1C]
                        transition duration-300
                        shadow-lg shadow-[#800020]/20
                        hover:-translate-y-0.5">

                        تسجيل الدخول

                        <i class="fa-solid fa-arrow-left mr-2"></i>

                    </button>

                </form>


                <!-- or -->

                <div class="flex items-center gap-3 my-6">

                    <div class="h-px bg-gray-200 flex-1">
                    </div>

                    <span class="text-gray-400 text-sm">
                        أو
                    </span>

                    <div class="h-px bg-gray-200 flex-1">
                    </div>

                </div>


                <!-- Google -->

                <button class="w-full h-12 border border-gray-200 rounded-xl
                    flex items-center justify-center gap-3
                    hover:bg-gray-50 transition">

                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">

                    <span class="text-sm font-bold text-gray-700">
                        تسجيل الدخول عبر Google
                    </span>

                </button>


                <!-- إنشاء حساب -->

                <p class="text-center text-sm text-gray-500 mt-6">

                    ليس لديك حساب؟

                    <a href="signup.html" class="text-[#800020] font-bold hover:underline mr-1">

                        إنشاء حساب

                    </a>

                </p>


            </div>

        </div>


        <!-- Image Login -->

        <div dir="rtl"
            class="relative flex w-[320px] mx-auto md:mx-0 rounded-2xl mb-5 md:mb-1 lg:w-[53%]  h-full overflow-hidden order-2 lg:order-1">


            <img src="../../dist/assets/images/Login/img-login.jpg" alt=""
                class="absolute inset-0 w-full h-full object-cover">


            <div class="absolute inset-0 bg-gradient-to-t from-[#4b071b]/70 via-[#800020]/20 to-transparent">
            </div>


            <div class="absolute inset-0 flex flex-col justify-between p-6 sm:p-8 md:p-10 text-white">

            </div>


            <!-- style-bg -->

            <div class="absolute top-0 -right-1 w-[70px] h-full bg-white hidden lg:block"
                style="clip-path: ellipse(55% 60% at 100% 50%);">
            </div>

        </div>


    </div>


    <!-- Message Success Login-->

    <div id="successMessage" class="hidden fixed inset-0 z-50 flex items-center justify-center
           bg-black/20 backdrop-blur-[4px] px-4">

        <div id="successCard" class="relative w-full max-w-[410px] overflow-hidden
               bg-white rounded-[30px] shadow-[0_25px_70px_rgba(0,0,0,0.18)]
               px-7 py-3 text-center"><div class="absolute top-0 left-0 w-full h-[4px]
                    bg-gradient-to-r from-transparent via-green-500 to-transparent">
            </div>


            <div class="relative mx-auto w-[105px] h-[105px] mb-6">


                <div id="successGlow" class="absolute inset-0 rounded-full bg-green-400/10 scale-75">
                </div>


                <div id="successCircle" class="absolute inset-[7px] rounded-full
                       border-[3px] border-green-500/20
                       flex items-center justify-center">


                    <div id="successInner" class="w-[76px] h-[76px] rounded-full
                           bg-gradient-to-br from-green-400 to-green-600
                           flex items-center justify-center
                           shadow-[0_10px_30px_rgba(34,197,94,0.30)]">


                        <svg id="checkMark" class="w-[42px] h-[42px]" viewBox="0 0 52 52" fill="none">

                            <path d="M14 27L23 36L39 17"
                                stroke="white"
                                stroke-width="4"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-dasharray="45"
                                stroke-dashoffset="45">
                            </path>

                        </svg>

                    </div>
                </div>


                <span class="absolute top-[5px] right-[12px] w-[7px] h-[7px]
                         bg-green-400 rounded-full animate-ping"></span>

                <span class="absolute bottom-[12px] left-[3px] w-[6px] h-[6px]
                         bg-green-500 rounded-full animate-pulse"></span>

                <span class="absolute top-[35px] left-[-2px] w-[5px] h-[5px]
                         bg-green-300 rounded-full animate-pulse"></span>

            </div>


            <!-- title -->

            <h2 id="successTitle" class="text-[26px] leading-tight font-bold text-black mb-3">
                اكتملت الخطوة بنجاح
            </h2>


            <!-- text -->

            <p class="text-[16px] leading-8 text-gray-500">

                <span class="text-[#E53935] font-bold text-xl ">وجهة</span> خطوتك الأولى نحو ما تريد

                <br>

            </p>


            <div class="mx-auto mt-6 w-[45px] h-[2px] bg-green-500/20 rounded-full"></div>


            <!-- back to home button -->

            <button id="goHome" type="button" class="group relative mt-3 mx-auto
                   w-[58px] h-[58px] rounded-full
                   bg-red-50 border border-green-100
                   flex items-center justify-center
                   transition-all duration-300
                   hover:bg-[#F93A3A] hover:shadow-[0_8px_25px_rgba(34,197,94,0.25)]
                   active:scale-90">

                <i id="arrowIcon" class="fa-solid fa-arrow-right
                       text-[#F93A3A] text-[22px]
                       transition-all duration-500
                       group-hover:text-white">
                </i>

            </button>

            <p class="mt-3 text-[13px] text-[#A01414]">
                اضغط للانتقال إلى الرئيسية
            </p>

        </div>
    </div>


    <script src="../../dist/js/login.js"></script>

</body>

</html>
