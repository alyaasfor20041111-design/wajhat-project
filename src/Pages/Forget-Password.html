<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> إعادة تعيين كلمة المرور | تأجير السيارات</title>

    <link rel="stylesheet" href="../../dist/assets/css/style.css">
    <link rel="stylesheet" href="../../dist/assets/css/forget-password.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Almarai:wght@300;400;700;800&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Almarai:wght@300;400;700;800&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>


<body class="min-h-screen bg-[#FAFAFA] flex items-center justify-center p-3 sm:p-5 font-sans">


    <section dir="ltr"
        class="relative w-full md:w-[90%] h-[1100px] md:h-[670px] gap-9 bg-white rounded-[30px] overflow-hidden shadow-2xl flex flex-col lg:flex-row">


        <!-- Info Login -->


        <div dir="rtl"
            class="relative w-full lg:w-[42%] bg-[#fffdfc] p-6 sm:p-8 md:p-10 lg:p-12  flex flex-col justify-center order-1 lg:order-2">





            <div class="relative z-10 mt-2 md:mt-10 md:mb-10">

                <div class=" relative">

                    <a href="Login.html"
                        class="absolute -top-[120px] md:-top-[70px] right-0 flex bg-[#F93A3A] w-fit text-white p-2 py-2 rounded">
                        <i class="fa-solid fa-arrow-right mt-[5px] ml-1"></i>
                        <p class="text-center justify-center ">تخطي</p>
                    </a>


                    <img src="../../dist/assets/images/Login/Img-lock.png" alt=""
                        class="w-[110px] absolute top-[-70px] right-24 md:right-40">


                    <h1 class=" text-3xl md:text-4xl mt-28 pt-8 mb-4 font-extrabold text-center text-[#480707]">
                        نسيت كلمة المرور؟
                    </h1>


                    <p class="text-gray-500 text-sm leading-6 text-center text-base">
                        لا تقلق! أدخل بريدك الإلكتروني لإعادة تعيين كلمة المرور.
                    </p>

                </div>


                <form id="loginForm" class="space-y-3">


                    <!-- Email -->

                    <div class="w-full">

                        <label class="block text-sm font-bold text-text mb-2 pt-4">
                            البريد الإلكتروني
                            <span class="text-red-600">*</span>
                        </label>

                        <div class="relative">

                            <i
                                class="fa-solid fa-envelope absolute right-4 top-1/2 -translate-y-1/2 text-[#F93A3A]"></i>

                            <input type="email" id="email" placeholder=" أدخل البريد الإلكتروني " class="w-full h-11 pr-10 pl-4 border placeholder-gray-400 border-text/25 shadow shadow-inner shadow-gray-200 rounded-xl bg-white outline-none transition
                                focus:border-text/40
                                focus:ring-2 focus:ring-[#800020]/10
                                  text-sm md:text-base">

                        </div>



                    </div>

                    <!-- Phone -->

                    <div class="w-full">

                        <label class="block text-sm font-bold text-text mb-2 mt-4">
                            رقم الهاتف
                            <span class="text-red-600">*</span>
                        </label>

                        <div class="relative">

                            <i class="fa-solid fa-phone absolute right-4 top-1/2 -translate-y-1/2 text-[#F93A3A]"></i>

                            <input type="tel" id="phone" placeholder="+963.." class="w-full h-11 pr-11 pl-4 border placeholder-gray-400 border-text/25 shadow shadow-inner shadow-gray-200 rounded-xl bg-white outline-none transition
                                    focus:border-text/40
                                    focus:ring-2 focus:ring-[#800020]/10
                                    text-sm md:text-base">

                        </div>

                        <p id="phoneError" class="hidden text-red-600 text-xs mt-1"></p>

                    </div>


                    <!-- Password -->

                    <div class="w-full">
                        <label class="block text-sm font-bold text-text mb-2">
                            كلمة المرور الجديدة
                            <span class="text-red-600">*</span>
                        </label>

                        <div class="relative">

                            <i class="fa-solid fa-lock absolute right-4 top-1/2 -translate-y-1/2 text-[#F93A3A]"></i>

                            <input type="password" id="password" placeholder=" كلمة المرور " class="w-full h-11 pr-11 pl-11 border placeholder-gray-400 border-text/25 shadow shadow-inner shadow-gray-200 rounded-xl bg-white outline-none transition
                                focus:border-text/40
                                focus:ring-2 focus:ring-[#800020]/10
                                text-sm md:text-base">


                            <!-- Password eye -->

                            <button type="button" onclick="toggleNewPassword()"
                                class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#800020]">

                                <i id="eyeIcon1" class="fa-solid fa-eye-slash"></i>

                            </button>

                        </div>

                    </div>


                    <!-- Confirm Password -->

                    <div class="w-full">

                        <label class="block text-sm font-bold text-text mb-2">
                            تأكيد كلمة المرور
                            <span class="text-red-600">*</span>
                        </label>

                        <div class="relative">

                            <i class="fa-solid fa-lock absolute right-4 top-1/2 -translate-y-1/2 text-[#F93A3A]"></i>

                            <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور" class="w-full h-11 pr-11 pl-11 border placeholder-gray-400 border-text/25 shadow shadow-inner shadow-gray-200 rounded-xl bg-white outline-none transition
                                focus:border-text/40
                                focus:ring-2 focus:ring-[#800020]/10
                                   text-sm md:text-base">


                            <!-- Confirm password eye -->

                            <button type="button" onclick="toggleConfirmPassword()"
                                class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#800020]">

                                <i id="eyeIcon2" class="fa-solid fa-eye-slash"></i>

                            </button>

                        </div>

                    </div>


                    <!-- Error message -->

                    <p id="errorMsg" class="hidden text-red-600 text-smtext-sm md:text-base bg-red-100/50 rounded-lg p-2">
                    </p>


                    <!-- Reset password button -->

                    <button type="submit"
                        class="w-full mt-4 md:mt-1 md:mb-10 h-12 rounded-xl text-white text-sm md:text-base  font-bold bg-[#F93A3A] hover:bg-[#E61C1C] transition duration-300 shadow-lg shadow-[#800020]/20 hover:-translate-y-0.5">

                        إعادة تعيين كلمة المرور

                        <i class="fa-solid fa-arrow-left mr-2"></i>

                    </button>


                </form>

            </div>

        </div>


        <!-- Image Login -->

        <div dir="rtl"
            class="relative flex w-[320px] mx-auto md:mx-0 rounded-2xl mb-5 md:mb-1 lg:w-[51%] h-full overflow-hidden order-2 lg:order-1">


            <img src="../../dist/assets/images/Login/img-login.jpg" alt=""
                class="absolute inset-0 w-full h-full object-cover">


            <div class="absolute inset-0 bg-gradient-to-t from-[#4b071b]/70 via-[#800020]/20 to-transparent">
            </div>


            <div class="absolute inset-0 flex flex-col justify-between p-6 sm:p-8 md:p-10 text-white">

            </div>


            <!-- style-bg -->
            <div class="absolute top-0 -right-1 w-[70px] h-full bg-white hidden lg:block"
                style="clip-path: ellipse(55% 60% at 100% 50%);">
            </div>

        </div>

    </section>


    <!-- Success message -->

    <div id="successMessage"
        class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/20 backdrop-blur-[4px] px-4">

        <div id="successCard"
            class="success-card relative w-full max-w-[410px] overflow-hidden bg-white rounded-[30px] shadow-2xl px-7 py-9 text-center">


            <!-- Green line -->

            <div class="absolute top-0 left-0 w-full h-[4px] bg-green-500"></div>


            <!-- Success icon -->

            <div class="relative mx-auto w-[105px] h-[105px] mb-6">

                <div class="success-ring absolute inset-[7px] rounded-full border-[3px] border-green-500/20
                    flex items-center justify-center">

                    <div class="success-circle w-[76px] h-[76px] rounded-full bg-green-500
                        flex items-center justify-center shadow-lg">

                        <svg class="w-[43px] h-[43px]" viewBox="0 0 52 52" fill="none">

                            <path id="checkMark" d="M14 27L23 36L39 17" stroke="white" stroke-width="4"
                                stroke-linecap="round" stroke-linejoin="round">
                            </path>

                        </svg>

                    </div>

                </div>


                <!-- Small circles -->

                <span class="absolute top-[7px] right-[10px] w-[7px] h-[7px]
                    bg-green-400 rounded-full animate-ping"></span>

                <span class="absolute bottom-[12px] left-[3px] w-[6px] h-[6px]
                    bg-green-500 rounded-full animate-pulse"></span>

                <span class="absolute top-[35px] left-[-2px] w-[5px] h-[5px]
                    bg-green-300 rounded-full animate-pulse"></span>

            </div>


            <!-- Success title -->

            <h2 class="text-[27px] leading-tight font-bold text-black mb-3">
                تم تعيين كلمة المرور بنجاح
            </h2>


            <p class="text-[16px] leading-8 text-gray-500">
                يمكنك الآن تسجيل الدخول بأمان
            </p>


            <!-- Small line -->

            <div class="mx-auto mt-6 w-[45px] h-[2px] bg-green-500/20 rounded-full">
            </div>


            <!-- Back to login -->

            <button id="backToLogin" type="button" class="group mt-6 mx-auto w-[58px] h-[58px] rounded-full
                bg-[#fff3f3] border border-red-100
                flex items-center justify-center
                transition-all duration-300 hover:bg-[#F93A3A]
                hover:shadow-lg active:scale-90">

                <i id="backArrow" class="fa-solid fa-arrow-right text-[#F93A3A] text-[22px]
                    transition-all duration-300 group-hover:text-white">
                </i>

            </button>


            <p class="mt-3 text-[13px] text-gray-400">
                اضغط للعودة إلى تسجيل الدخول
            </p>

        </div>

    </div>






    <script src="../../dist/js/login.js"></script>
    <script src="../../dist/js/script.js"></script>




































    <script>document.addEventListener("DOMContentLoaded", function () {

            // Get elements
            const form = document.getElementById("loginForm");

            const email = document.getElementById("email");
            const phone = document.getElementById("phone");

            const password = document.getElementById("password");
            const confirmPassword = document.getElementById("confirmPassword");

            const errorMsg = document.getElementById("errorMsg");

            const successMessage = document.getElementById("successMessage");
            const backToLogin = document.getElementById("backToLogin");


            // Show new password
            window.toggleNewPassword = function () {

                if (password.type === "password") {

                    password.type = "text";

                    document.getElementById("eyeIcon1").classList.remove("fa-eye-slash");
                    document.getElementById("eyeIcon1").classList.add("fa-eye");

                } else {

                    password.type = "password";

                    document.getElementById("eyeIcon1").classList.remove("fa-eye");
                    document.getElementById("eyeIcon1").classList.add("fa-eye-slash");
                }
            };


            // Show confirm password
            window.toggleConfirmPassword = function () {

                if (confirmPassword.type === "password") {

                    confirmPassword.type = "text";

                    document.getElementById("eyeIcon2").classList.remove("fa-eye-slash");
                    document.getElementById("eyeIcon2").classList.add("fa-eye");

                } else {

                    confirmPassword.type = "password";

                    document.getElementById("eyeIcon2").classList.remove("fa-eye");
                    document.getElementById("eyeIcon2").classList.add("fa-eye-slash");
                }
            };


            // Hide error when typing
            email.addEventListener("input", function () {
                errorMsg.classList.add("hidden");
            });

            phone.addEventListener("input", function () {
                errorMsg.classList.add("hidden");
            });

            password.addEventListener("input", function () {
                errorMsg.classList.add("hidden");
            });

            confirmPassword.addEventListener("input", function () {
                errorMsg.classList.add("hidden");
            });


            // Reset password
            form.addEventListener("submit", function (e) {

                e.preventDefault();

                const emailValue = email.value.trim();
                const phoneValue = phone.value.trim();
                const passwordValue = password.value;
                const confirmValue = confirmPassword.value;


                // Check empty fields
                if (
                    emailValue === "" ||
                    phoneValue === "" ||
                    passwordValue === "" ||
                    confirmValue === ""
                ) {

                    errorMsg.textContent = "يجب إدخال جميع الحقول المطلوبة";
                    errorMsg.classList.remove("hidden");

                    return;
                }


                // Check password length
                if (passwordValue.length < 8) {

                    errorMsg.textContent =
                        "يجب أن تكون كلمة المرور 8 محارف على الأقل";

                    errorMsg.classList.remove("hidden");

                    return;
                }


                // Check password match
                if (passwordValue !== confirmValue) {

                    errorMsg.textContent =
                        "كلمة المرور غير متطابقة";

                    errorMsg.classList.remove("hidden");

                    return;
                }


                // Hide error
                errorMsg.classList.add("hidden");


                // Show success message
                successMessage.classList.remove("hidden");


                // Success animation
                const successCard =
                    document.getElementById("successCard");

                const successRing =
                    document.querySelector(".success-ring");

                const successCircle =
                    document.querySelector(".success-circle");

                const checkMark =
                    document.getElementById("checkMark");


                // Card animation
                successCard.style.opacity = "0";
                successCard.style.transform =
                    "translateY(30px) scale(0.92)";

                setTimeout(function () {

                    successCard.style.transition =
                        "all 0.6s ease";

                    successCard.style.opacity = "1";
                    successCard.style.transform =
                        "translateY(0) scale(1)";

                }, 50);


                // Ring animation
                if (successRing) {

                    successRing.style.transform = "scale(0.6)";
                    successRing.style.opacity = "0";

                    setTimeout(function () {

                        successRing.style.transition =
                            "all 0.6s ease";

                        successRing.style.transform =
                            "scale(1)";

                        successRing.style.opacity = "1";

                    }, 150);
                }


                // Circle animation
                if (successCircle) {

                    successCircle.style.transform = "scale(0)";

                    setTimeout(function () {

                        successCircle.style.transition =
                            "transform 0.6s ease";

                        successCircle.style.transform =
                            "scale(1)";

                    }, 300);
                }


                // Check animation
                if (checkMark) {

                    checkMark.style.strokeDasharray = "45";
                    checkMark.style.strokeDashoffset = "45";

                    setTimeout(function () {

                        checkMark.style.transition =
                            "stroke-dashoffset 0.6s ease";

                        checkMark.style.strokeDashoffset = "0";

                    }, 500);
                }

            });


            // Back to login
            backToLogin.addEventListener("click", function () {

                window.location.href = "login.html";

            });

        });</script>




    </script>



</body>

</html>
