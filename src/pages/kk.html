    <h1>إتمام الحجز</h1>
    <!-- Reservation Page Header Start -->
    <section class="py-[30px] md:py-0">
        <div class="max-w-7xl mx-auto reservation-header  border border-card-tint
        bg-card-bg flex md:flex-row flex-col justify-between items-center px-8 rounded-[10px]">
            <div class="reservation-header-info right-origin flex flex-col md:justify-between 
                justify-end text-center w-[90%] md:text-start md:w-[60%]  ">
                <h1 class="text-heading text-4xl font-bold  mb-20 ">Honda CR-V</h1>

                <div class="flex md:flex-row flex-col justify-between text-text text-2xl">
                    <div class="flex gap-2 items-center">
                        <!-- <i class="fas fa-calendar-alt"></i> -->
                        <span>موديل 2018</span>
                    </div>
                    <div class="flex gap-2 items-center">
                        <i class="fa-solid fa-gears"></i>
                        <span>CVT</span>
                    </div>


                    <div class="flex gap-2 items-center">
                        <i class="fa-solid fa-gas-pump"></i>
                        <span>بنزين</span>
                    </div>


                    <div class="flex gap-2 items-center">
                        <i class="fa-solid fa-users"></i>
                        <span>مقاعد</span>
                    </div>


                </div>
            </div>
            <div class="reservation-header-img left-origin md:w-[35%] flex items-center justify-center">
                <img class="w-[90%] md:w-full " src="../../dist/assets/images/reservation/hero2.png" alt="">
            </div>
        </div>
    </section>

        <div class="max-w-7xl mx-auto reservation-header  border border-card-tint

            <div class="flex gap-2 text-heading">
                <div class="w-[45px] h-[45px] rounded-full bg-primary relative">
                    <div class="absolute top-[50%] -translate-y-1/2  left-[50%] -translate-x-1/2 font-bold text-xl">1
                    </div>

                <h2 class="md:text-3xl text-2xl font-bold mb-4 ">بيانات الحجز</h2>
            </div>
            <div class="flex md:flex-row flex-col justify-center gap-20 items-center">

                    <!-- <h3 class="text-lg font-semibold text-heading flex items-center gap-2">
                     معلومات الاستلام
                 </h3> -->

                    <div class="flex flex-col gap-3">
                        <div>
                            <label class="text-md font-bold text-heading mb-2 flex gap-2 items-center ps-1">
                                <i class="fas fa-calendar-alt"></i>
                                <span>تاريخ الاستلام</span>
                            </label>
                            <input type="date" class="block w-full  py-2.5 bg-white border
                              border-default-medium text-heading text-sm rounded-base 
                               focus:ring-heading focus:border-heading px-3 py-2.5 shadow-md
                                placeholder:text-muted cursor-pointer
                                  ">
                        </div>

                        <div>
                            <label class="text-md font-bold text-heading mb-2 flex gap-2 items-center ps-1">
                                <i class="fa-solid fa-clock"></i>
                                <span>وقت الاستلام</span>
                            </label>
                            <input type="time" class="block w-full  py-2.5 bg-white border
                              border-default-medium text-heading text-sm rounded-base 
                               focus:ring-heading focus:border-heading px-3 py-2.5 shadow-md
                                placeholder:text-muted cursor-pointer">
                        </div>
                        <div>
                            <label class="text-md font-bold text-heading mb-2 flex gap-2 items-center ps-1">
                                <i class="fa-solid fa-location-dot"></i>

                                </a>
                            </div>


                        </div>

                        <div>

                                <i class="fa-solid fa-location-dot"></i>
